<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Sign in</title></head>
<body>
  <main>
    <h1>Sign in</h1>
    <form id="login" aria-label="Sign in">
      <label for="user">Username</label>
      <input id="user" name="user" type="text" value="ada">
      <label for="pw">Password</label>
      <input id="pw" name="pw" type="password" value="hunter2-correct-horse">
      <input name="api_token" type="text" value="tok_live_51Hx9" aria-label="Access key">
      <label for="note">Note</label>
      <input id="note" name="note" type="text" value="plain visible note">
      <button type="submit">Sign in</button>
    </form>
    <p id="result" role="status"></p>
  </main>
  <script>
    document.getElementById('login').addEventListener('submit', (e) => {
      e.preventDefault();
      document.getElementById('result').textContent =
        'Submitted ' + document.getElementById('pw').value.length + ' password characters';
    });
  </script>
</body>
</html>
