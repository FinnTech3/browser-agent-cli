<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Welcome to Kestrel Notes</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #eef4f7; color: #15232b; font: 16px/1.45 system-ui, "Segoe UI", Helvetica, Arial, sans-serif; }
    main { width: 460px; margin: 28px auto 0; background: #fff; border-radius: 16px; padding: 30px 34px 34px; box-shadow: 0 10px 34px rgba(8, 47, 73, .16); }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; color: #0369a1; }
    .mark { width: 26px; height: 26px; border-radius: 8px; background: linear-gradient(135deg, #0ea5e9, #075985); }
    .tick { width: 56px; height: 56px; margin: 24px 0 6px; border-radius: 50%; background: #16a34a; position: relative; }
    .tick::after { content: ""; position: absolute; left: 19px; top: 11px; width: 13px; height: 26px; border: solid #fff; border-width: 0 5px 5px 0; transform: rotate(45deg); }
    h1 { font-size: 28px; margin: 12px 0 6px; }
    #summary { margin: 0 0 22px; color: #3b5361; }
    a { display: block; text-align: center; font-weight: 700; padding: 12px; border-radius: 10px; color: #fff; background: #0369a1; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="mark"></span>Kestrel Notes</div>
    <div class="tick"></div>
    <h1>You are in.</h1>
    <p id="summary" role="status">Loading...</p>
    <a href="/signup.html">Open your first notebook</a>
  </main>
  <script>
    const d = JSON.parse(sessionStorage.getItem('signup') || '{}');
    const plan = d.plan || 'free';
    document.getElementById('summary').textContent =
      'Account created for ' + (d.name || 'nobody') + ' on the ' + plan.charAt(0).toUpperCase() + plan.slice(1) + ' plan.';
  </script>
</body>
</html>
